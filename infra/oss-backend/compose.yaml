name: axivestra-oss-backend-prototype

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: axivestra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:-axivestra-local-postgres-change-me}
      PGRST_DB_PASSWORD: \${PGRST_DB_PASSWORD:-axivestra-local-postgrest-change-me}
      API_DB_PASSWORD: \${API_DB_PASSWORD:-axivestra-local-api-change-me}
    ports:
      - "127.0.0.1:\${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/001-bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axivestra"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: \${KEYCLOAK_ADMIN:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: \${KEYCLOAK_ADMIN_PASSWORD:-axivestra-local-keycloak-admin-change-me}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "http://localhost:\${KEYCLOAK_PORT:-8180}"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:\${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/axivestra-realm.json:/opt/keycloak/data/import/axivestra-realm.json:ro
    restart: unless-stopped

  keycloak-jwks-init:
    image: node:22-alpine
    command: ["node", "/scripts/fetch-keycloak-jwks.mjs"]
    environment:
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/axivestra/protocol/openid-connect/certs
      JWKS_OUTPUT: /run/secrets/keycloak-jwks.json
    volumes:
      - ./scripts/fetch-keycloak-jwks.mjs:/scripts/fetch-keycloak-jwks.mjs:ro
      - keycloak-jwks:/run/secrets
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"

  postgrest:
    image: postgrest/postgrest:v16.6
    environment:
      PGRST_DB_URI: postgres://authenticator:\${PGRST_DB_PASSWORD:-axivestra-local-postgrest-change-me}@db:5432/axivestra
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_POOL: "10"
      PGRST_JWT_SECRET: "@/run/secrets/keycloak-jwks.json"
      PGRST_JWT_ISS: "http://localhost:\${KEYCLOAK_PORT:-8180}/realms/axivestra"
      PGRST_JWT_AUD: axivestra-api
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: "3000"
      PGRST_LOG_LEVEL: info
    ports:
      - "127.0.0.1:\${POSTGREST_PORT:-8300}:3000"
    volumes:
      - keycloak-jwks:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      keycloak-jwks-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://axivestra_api:\${API_DB_PASSWORD:-axivestra-local-api-change-me}@db:5432/axivestra
      OIDC_ISSUER: "http://localhost:\${KEYCLOAK_PORT:-8180}/realms/axivestra"
      OIDC_JWKS_URL: http://keycloak:8080/realms/axivestra/protocol/openid-connect/certs
      OIDC_AUDIENCE: axivestra-api
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      POSTGREST_INTERNAL_URL: http://postgrest:3000
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: \${S3_ACCESS_KEY:-axivestra-local-s3-user}
      S3_SECRET_KEY: \${S3_SECRET_KEY:-axivestra-local-s3-secret-change-me}
    ports:
      - "127.0.0.1:\${API_PORT:-8380}:3000"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      postgrest:
        condition: service_started
      seaweedfs:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  seaweedfs-config-init:
    image: node:22-alpine
    command: ["node", "/scripts/write-seaweedfs-config.mjs"]
    environment:
      S3_ACCESS_KEY: \${S3_ACCESS_KEY:-axivestra-local-s3-user}
      S3_SECRET_KEY: \${S3_SECRET_KEY:-axivestra-local-s3-secret-change-me}
      S3_CONFIG_OUTPUT: /config/s3.json
    volumes:
      - ./scripts/write-seaweedfs-config.mjs:/scripts/write-seaweedfs-config.mjs:ro
      - seaweedfs-config:/config
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:\${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      - seaweedfs-config:/etc/seaweedfs:ro
    depends_on:
      seaweedfs-config-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  keycloak-jwks:
  seaweedfs-data:
  seaweedfs-config:
