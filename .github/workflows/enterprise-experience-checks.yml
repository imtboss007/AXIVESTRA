name: AXIVESTRA enterprise experience verification

on:
  push:
    branches:
      - feature/axivestra-enterprise-experience
      - feature/axivestra-visual-integration
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/enterprise-experience-checks.yml"

permissions:
  contents: read

concurrency:
  group: axivestra-enterprise-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, regression tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run regression and enterprise contract tests
        run: npm test

      - name: Run TypeScript and Vite production build
        run: npm run build
