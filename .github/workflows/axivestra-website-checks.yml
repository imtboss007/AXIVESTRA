name: AXIVESTRA public website checks

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/axivestra-website-checks.yml"
  push:
    branches:
      - feature/axivestra-public-website
    paths:
      - "website/**"
      - ".github/workflows/axivestra-website-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    name: Website security contracts and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run website security contract tests
        run: npm test
      - name: Build public website and admin console
        run: npm run build
